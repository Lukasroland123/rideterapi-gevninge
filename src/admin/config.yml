# =====================================================================
#  Redigeringssystem for Hesteassisteret Praksis
#
#  "repo" nedenfor peger på det GitHub-repository, hvor indholdet gemmes.
#  Skifter repositoriet navn eller ejer, skal linjen rettes tilsvarende.
# =====================================================================

backend:
  name: github
  repo: Lukasroland123/rideterapi-gevninge
  branch: main

  # Login gaar gennem vores egen Cloudflare Worker (sveltia-cms-auth) i stedet
  # for Netlifys tjeneste. Skifter Workeren adresse, skal linjen her foelge med,
  # og callback-adressen i GitHub-appen skal rettes tilsvarende.
  base_url: https://sveltia-cms-auth.lukas-rs-arbejde.workers.dev

  # Skriv beskeden ind i historikken paa almindeligt dansk
  commit_messages:
    update: "Rettet {{collection}} · {{author-name}}"
    uploadMedia: "Nyt billede: {{path}}"
    deleteMedia: "Slettet billede: {{path}}"

# Hvor billeder lægges, og hvordan de findes af hjemmesiden
media_folder: "src/billeder"
public_folder: "/billeder"

collections:
  # -------------------------------------------------------------------
  - name: sider
    label: "Sider"
    files:

      # ---------------------------------------------------------------
      - name: forside
        label: "Forside"
        file: "src/_data/forside.json"
        description: "Den første side folk lander på."
        fields:
          - { name: hero_mikrotekst, label: "Lille tekst over overskriften", widget: string }
          - { name: hero_overskrift, label: "Stor overskrift", widget: string }
          - { name: hero_tekst, label: "Tekst under overskriften", widget: text }
          - { name: hero_knap1, label: "Tekst på orange knap", widget: string }
          - { name: hero_knap2, label: "Tekst på hvid knap", widget: string }
          - { name: hero_billede, label: "Stort billede øverst", widget: image }
          - { name: hero_billede_alt, label: "Hvad ser man på billedet?", widget: string, hint: "Læses højt for blinde og bruges af Google i stedet for billedet. Beskriv hvad man rent faktisk SER, fx 'Barn børster en brun pony på folden'. Ikke en stemning." }
          - { name: hero_billedtekst, label: "Billedtekst (vises under billedet)", widget: string, required: false, hint: "Den tekst, der står med kursiv under billedet på siden. Her er der plads til stemningen. Lad feltet stå tomt, hvis der ingen tekst skal være." }
          - name: hero_maerkater
            label: "De tre små mærkater"
            widget: list
            allow_add: false
            allow_remove: false
            fields:
              - { name: tekst, label: "Tekst", widget: string }

          - { name: problemer_overskrift, label: "Overskrift · afsnittet med seks kort", widget: string }
          - { name: problemer_intro, label: "Introtekst", widget: text }
          - name: problemer_kort
            label: "De seks kort"
            widget: list
            allow_add: false
            allow_remove: false
            fields:
              - { name: overskrift, label: "Overskrift", widget: string }
              - { name: tekst, label: "Tekst", widget: text }

          - { name: tilbud_mikrotekst, label: "Lille tekst · afsnittet om de tre tilbud", widget: string }
          - { name: tilbud_overskrift, label: "Overskrift", widget: string }
          - { name: tilbud_intro, label: "Introtekst", widget: text }
          - name: tilbud_kort
            label: "De tre tilbud"
            widget: list
            allow_add: false
            allow_remove: false
            fields:
              - { name: overskrift, label: "Overskrift", widget: string }
              - { name: tekst, label: "Tekst", widget: text, hint: "Lav en tom linje mellem afsnit." }
              - { name: link_tekst, label: "Tekst på linket nederst", widget: string }

          - { name: hvorfor_mikrotekst, label: "Lille tekst · afsnittet 'Hvorfor heste'", widget: string }
          - { name: hvorfor_overskrift, label: "Overskrift", widget: string }
          - { name: hvorfor_tekst, label: "Tekst", widget: text, hint: "Lav en tom linje mellem afsnit." }
          - { name: hvorfor_billede, label: "Billede", widget: image }
          - { name: hvorfor_billede_alt, label: "Hvad ser man på billedet?", widget: string, hint: "Læses højt for blinde og bruges af Google i stedet for billedet. Beskriv hvad man rent faktisk SER, fx 'Barn børster en brun pony på folden'. Ikke en stemning." }
          - { name: hvorfor_billedtekst, label: "Billedtekst (vises under billedet)", widget: string, required: false, hint: "Den tekst, der står med kursiv under billedet på siden. Her er der plads til stemningen. Lad feltet stå tomt, hvis der ingen tekst skal være." }
          - { name: hvorfor_boks_titel, label: "Grøn boks · fed indledning", widget: string }
          - { name: hvorfor_boks_tekst, label: "Grøn boks · tekst", widget: text }
          - { name: hvorfor_boks_link, label: "Grøn boks · tekst på linket", widget: string }

